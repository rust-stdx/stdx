[package]
name = "bel_derive"
version = "0.1.0"
description = "Derive macro for converting Rust values into CEL values for the bel crate."
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[lints]
workspace = true

[lib]
path = "./bel_derive.rs"
proc-macro = true

[dependencies]
proc-macro2 = { workspace = true, features = ["proc-macro"] }
quote = { workspace = true, features = ["proc-macro"] }
syn = { workspace = true, features = ["derive", "parsing", "printing", "proc-macro", "clone-impls"] }
