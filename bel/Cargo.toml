[package]
name = "bel"
version = "0.11.0"
description = "A parser and interpreter for the Better Expression Language (BEL)"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[lints]
workspace = true

[features]
default = ["regex", "time", "ip"]
derive = ["dep:bel_derive"]
ip = ["dep:ipnetwork"]
json = ["dep:json", "dep:base64"]
regex = ["dep:regex"]
time = ["dep:time", "dep:nom"]

[dependencies]
bel_derive = { path = "bel_derive", optional = true }
base64 = { path = "../base64", optional = true }
ipnetwork = { path = "../ipnetwork", optional = true }
json = { path = "../json", optional = true, default-features = false, features = ["alloc"] }
paste = { path = "../paste" }
thiserror = { path = "../thiserror" }
time = { path = "../time", optional = true }

antlr4rust = { workspace = true }
nom = { workspace = true, optional = true, features = ["std"] }
regex = { workspace = true, optional = true, features = ["std", "perf", "unicode"] }
