[package]
name = "bel"
version = "0.11.0"
description = "A parser and interpreter for the Better Expression Language (BEL)"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[lints]
workspace = true

[features]
default = ["regex", "time", "ip"]
ip = ["dep:ipnetwork"]
json = ["dep:json", "dep:base64"]
regex = ["dep:regex"]
time = ["dep:time"]
# arbitrary = ["dep:arbitrary", "time?/arbitrary", "time?/std"]
# dhat-heap = [ ] # if you are doing heap profiling


[dependencies]
base64 = { path = "../base64", optional = true }
ipnetwork = { path = "../ipnetwork", optional = true, features = ["serde"] }
json = { path = "../json", optional = true, default-features = false, features = ["alloc"] }
thiserror = { path = "../thiserror" }
time = { path = "../time", optional = true, features = ["serde"] }

antlr4rust = { workspace = true }
arbitrary = { workspace = true, optional = true }
nom = { workspace = true }
paste = { workspace = true }
regex = { workspace = true, optional = true }
serde = { workspace = true, features = ["derive", "std"] }

[dev-dependencies]
serde_bytes = { path = "../serde_bytes" }

serde_json = { workspace = true }
