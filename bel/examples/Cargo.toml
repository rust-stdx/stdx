[package]
name = "bel_examples"
version = "0.1.0"
description = "Example programs for the BEL expression language."
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[lints]
workspace = true

[features]
hyper = ["dep:bytes", "dep:hyper", "dep:hyper_utils", "dep:json", "dep:thiserror", "dep:tokio"]
json = ["dep:json", "bel/json"]
time = ["dep:time", "bel/time"]
anyhow = ["dep:anyerr"]
regex = ["bel/regex"]
ip = ["bel/ip"]

[dependencies]
anyerr = { path = "../../anyerr", optional = true }
bel = { path = "..", default-features = false }
hyper_utils = { path = "../../hyper_utils", optional = true }
json = { path = "../../json", optional = true }
thiserror = { path = "../../thiserror", optional = true }
time = { path = "../../time", optional = true }

bytes = { workspace = true, optional = true }
hyper = { workspace = true, optional = true, features = ["http1", "server"] }
tokio = { workspace = true, optional = true, features = ["macros", "rt-multi-thread", "net"] }

[[bin]]
name = "simple"
path = "src/simple.rs"
required-features = ["regex"]

[[bin]]
name = "variables"
path = "src/variables.rs"

[[bin]]
name = "functions"
path = "src/functions.rs"
required-features = ["time"]

[[bin]]
name = "threads"
path = "src/threads.rs"

[[bin]]
name = "hyper"
path = "src/hyper.rs"
required-features = ["hyper"]

[[bin]]
name = "json"
path = "src/json.rs"
required-features = ["json"]

[[bin]]
name = "anyhow"
path = "src/anyhow.rs"
required-features = ["anyhow"]


[[bin]]
name = "ip"
path = "src/ip.rs"
required-features = ["ip"]
