[package]
name = "hex"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
description = "Fast hex encoding and decoding with SIMD, constant-time ops, and const fn support"

[lints]
workspace = true

[lib]
path = "./hex.rs"

[features]
default = ["alloc"]
alloc = []
serde = ["dep:serde"]

[dependencies]
serde = { workspace = true, optional = true }

[dev-dependencies]
serde_json = { workspace = true }

[target.'cfg(not(target_arch = "wasm32"))'.dev-dependencies]
criterion = { workspace = true }

[[bench]]
name = "bench"
harness = false
