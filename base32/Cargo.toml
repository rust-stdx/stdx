[package]
name = "base32"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true

[lints]
workspace = true

[lib]
path = "./base32.rs"

[features]
default = ["alloc"]
alloc = []
serde = ["dep:serde"]
small_collections = ["dep:small_collections", "serde", "alloc"]

[dependencies]
serde = { workspace = true, optional = true }
small_collections = { workspace = true, optional = true, default-features = false }

[dev-dependencies]
alloc_counter = { path = "../alloc_counter" }
serde_json = { workspace = true }
serde_test = { workspace = true }

[target.'cfg(not(target_arch = "wasm32"))'.dev-dependencies]
criterion = { workspace = true }

[[bench]]
name = "bench"
harness = false
