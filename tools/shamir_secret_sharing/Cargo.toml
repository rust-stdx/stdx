[package]
name = "shamir_secret_sharing"
version = "0.1.0"
description = "Shamir secret sharing command-line tool using GF(256) polynomials."
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[lints]
workspace = true

[[bin]]
name = "shamir_secret_sharing"
path = "shamir_secret_sharing.rs"

[dependencies]
base64 = { path = "../../base64" }
crypto = { path = "../../crypto" }
getopts = { path = "../../getopts" }
random = { path = "../../random", default-features = false, features = ["system"] }
term = { path = "../../term" }
zeroize = { path = "../../zeroize", default-features = false, features = ["alloc"] }
