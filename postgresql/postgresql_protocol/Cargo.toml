[package]
name = "postgresql_protocol"
version = "0.1.0"
description = "PostgreSQL wire protocol codec and authentication state machine"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[lints]
workspace = true

[lib]
path = "postgresql_protocol.rs"

[dependencies]
base64 = { path = "../../base64" }
constant_time_eq = { path = "../../constant_time_eq" }
crypto = { path = "../../crypto" }
hex = { path = "../../hex" }
small_collections = { path = "../../small_collections" }
thiserror = { path = "../../thiserror" }
zeroize = { path = "../../zeroize", default-features = false, features = ["derive", "alloc"] }

bytes = { workspace = true }
