[workspace.package]
edition = "2024"
rust-version = "1.99"
license = "MIT"
repository = "https://github.com/rust-stdx/stdx"

[profile.dev]
debug = "line-tables-only"

[profile.test]
debug = "line-tables-only"

# Full debug info for the rare session that needs a debugger. The default dev
# and test profiles keep only line tables to save build time and disk.
[profile.debugging]
inherits = "dev"
debug = true

# The Stripe client is generated from Stripe's full OpenAPI specification and
# is very large; emitting debug information for it pushes rustc past the memory
# available in constrained CI images. Debug info for this package is therefore
# disabled in the dev and test profiles. Use `cargo check` for full type
# checking, or enable debug info explicitly when needed.
[profile.dev.package.stripe]
debug = false

[profile.test.package.stripe]
debug = false

# The following packages may stack overflow in WASM debug builds so we need to force them to compile to
# release builds even in test mode.
[profile.test.package.crypto]
opt-level = 3

[profile.test.package.hpke]
opt-level = 3

[profile.test.package.jwt]
opt-level = 3

[profile.test.package.cose]
opt-level = 3

[profile.test.package.maxminddb]
opt-level = 3

[workspace.lints.clippy]
needless_return = "allow"
type_complexity = "allow"
too_many_arguments = "allow"
new_without_default = "allow"
needless_range_loop = "allow"
manual_c_str_literals = "allow"

[workspace.dependencies]
antlr4rust = { version = "=0.3.0-rc2", default-features = false }
