[workspace]
resolver = "2"

members = [
    "acme",
    "alloc_counter",
    "anyerr",
    "base32",
    "base64",
    "bel",
    # "bel/benchmarks",
    "bel/examples",
    # "bel/fuzz",
    "big_number",
    "constant_time_eq",
    "count_instructions",
    "countries",
    "crc32",
    "cron",
    "crypto",
    "crypto_rustls",
    "csv",
    "docker",
    "dotenv",
    "dotenv/dotenv_derive",
    "embed",
    "embed/embed_impl",
    "errgroup",
    "embed/embed_utils",
    "form_urlencoded",
    "getopts",
    "hex",
    "hostname",
    "hpke",
    "html_escape",
    "indexmap",
    "ipnetwork",
    "json_rpc",
    "jwt",
    "landlock",
    "mail_builder",
    "maxminddb",
    "media_type",
    "memmem",
    "net",
    "num_cpus",
    "percent_encoding",
    "pin_project_lite",
    "postgresql",
    "postgresql/postgresql_derive",
    "postgresql/postgresql_macros",
    "postgresql/postgresql_protocol",
    "postmark",
    "retry",
    "ryu",
    "s3",
    "scheduler",
    "semver",
    "serde_bytes",
    "serde_urlencoded",
    "serde_yaml",
    "single_instance",
    "singleflight",
    "small_collections",
    "strings",
    "stripe",
    "stripe/codegen",
    "template",
    "term",
    "thiserror",
    "thiserror/impl",
    "thiserror/tests/no-std",
    "time",
    "tld",
    "tokio_fast_udp",
    "tools/crypt",
    "tools/duplicates",
    "tools/energy_bench",
    "unsafe_libyaml",
    "uuid",
    "xxhash",
    "zeroize",
    "zeroize/zeroize_derive",
]

[workspace.package]
edition = "2024"
rust-version = "1.99"

# The Stripe client is generated from Stripe's full OpenAPI specification and
# is very large; emitting debug information for it pushes rustc past the memory
# available in constrained CI images. Debug info for this package is therefore
# disabled in the dev and test profiles. Use `cargo check` for full type
# checking, or enable debug info explicitly when needed.
[profile.dev.package.stripe]
debug = false

[profile.test.package.stripe]
debug = false

# The following packages may stack overflow in WASM debug builds so we need to force them to compile to
# release builds even in test mode.
[profile.test.package.crypto]
opt-level = 3

[profile.test.package.hpke]
opt-level = 3

[profile.test.package.jwt]
opt-level = 3

[workspace.lints.clippy]
needless_return = "allow"
type_complexity = "allow"
too_many_arguments = "allow"
new_without_default = "allow"
needless_range_loop = "allow"

[workspace.dependencies]
anyerr = { path = "anyerr" }
antlr4rust = "=0.3.0-rc2"
arbitrary = { version = "1", features = ["derive"] }
axum = { version = "0.8", default-features = false, features = ["http1", "json", "tokio"] }
bytes = { version = "1", default-features = false }
futures-util = "0.3"
getrandom = { version = "0.4", default-features = false }
heapless = "0.9"
hyper = { version = "1", features = ["full"] }
indexmap = { path = "indexmap" }
libc = "0.2"
memchr = { version = "2", default-features = false }
nom = "8"
paste = { git = "https://github.com/dtolnay/paste", rev = "6a302522990cbfd9de4e0c61d91854622f7b2999" }
quick-xml = { version = "0.38", features = ["serialize"] }
rand = "0.10"
regex = { version = "1" }
reqwest = { version = "0.13", default-features = false, features = ["gzip", "http2", "json", "rustls-no-provider"] }
rustls = { version = "0.23", default-features = false, features = ["std"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["logging"] }
serde = { version = "1", default-features = false }
serde_core = { version = "1", default-features = false }
serde_json = "1"
serde_test = "1"
small_collections = { path = "small_collections" }
time = { path = "time" }
tokio = { version = "1", features = ["full"] }
tracing = "0.1"
unicode-width = "0.1"
url = "2"
walkdir = "2"
zeroize = { path = "zeroize", default-features = false, features = ["derive"] }


# For macros
syn = { version = "3", default-features = false, features = ["derive", "extra-traits", "parsing", "proc-macro", "printing"] }
quote = "1"
proc-macro2 = "1"

# benchmarks
criterion = { version = "0.8", features = ["html_reports"] }
