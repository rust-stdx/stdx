[package]
name = "s3"
version = "0.1.0"
description = "A minimal S3 client focused on the most common operations."
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[lints]
workspace = true

[lib]
path = "s3.rs"

[features]
default = ["reqwest"]
reqwest = ["dep:reqwest"]

[dependencies]
base64 = { path = "../base64" }
crypto = { path = "../crypto" }
hex = { path = "../hex" }

bytes = { workspace = true }
futures-util = { workspace = true }
quick-xml = { workspace = true }
reqwest = { workspace = true, features = ["stream"], optional = true }
serde = { workspace = true, features = ["derive"] }
url = { workspace = true }

[dev-dependencies]
crypto_rustls = { path = "../crypto_rustls" }

tokio = { workspace = true }
