[package]
name = "anyerr"
version = "1.0.86"
description = "Flexible concrete Error type built on std::error::Error"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[lints]
workspace = true

[features]
default = ["std"]
std = []

[dependencies]

[dev-dependencies]
thiserror = { path = "../thiserror" }
