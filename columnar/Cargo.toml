[package]
name = "columnar"
version = "0.1.0"
description = "CBOR-enveloped columnar encoding for Rust structs"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[lints]
workspace = true

[lib]
path = "./columnar.rs"

[features]
default = ["std", "derive"]
std = ["cbor/std"]
derive = ["dep:columnar_derive"]

[dependencies]
columnar_derive = { path = "./columnar_derive", optional = true }

cbor = { path = "../cbor", default-features = false, features = ["alloc"] }

[dev-dependencies]
alloc_counter = { path = "../alloc_counter" }

[package.metadata.docs.rs]
all-features = true
