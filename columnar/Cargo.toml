[package]
name = "columnar"
version = "0.1.0"
description = "Columnar encoding for Rust structs"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[lints]
workspace = true

[lib]
path = "./columnar.rs"

[features]
default = ["std"]
std = ["cbor/std", "utf8/std"]

[dependencies]
columnar_derive = { path = "./columnar_derive" }

cbor = { path = "../cbor", default-features = false, features = ["alloc"] }
utf8 = { path = "../utf8", default-features = false }

[dev-dependencies]
alloc_counter = { path = "../alloc_counter" }

[package.metadata.docs.rs]
all-features = true
