[package]
name = "semver"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
description = "Semantic Versioning 2.0 parser and comparator"

[lints]
workspace = true

[lib]
path = "./semver.rs"

[features]
serde = ["dep:serde"]

[dependencies]
serde = { workspace = true, optional = true, default-features = false, features = ["derive", "alloc"] }

[dev-dependencies]
serde_json = { workspace = true }
