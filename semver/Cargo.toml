[package]
name = "semver"
version = "0.1.0"
description = "Semantic Versioning 2.0 parser and comparator"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[lints]
workspace = true

[lib]
path = "./semver.rs"

[features]
cbor = ["dep:cbor"]
json = ["dep:json"]
[dependencies]
cbor = { path = "../cbor", optional = true, default-features = false, features = ["alloc"] }
json = { path = "../json", optional = true, default-features = false, features = ["alloc"] }
