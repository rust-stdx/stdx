[package]
name = "crypto"
version = "0.1.0"
edition = "2024"

[lib]
path = "./src/crypto.rs"

[features]
default = ["std", "zeroize"]

alloc = ["dep:small_collections", "memchr/alloc", "base64/alloc", "big_number/alloc", "zeroize?/alloc"]
random = ["dep:getrandom"]
std = ["alloc", "small_collections?/std", "blake3/std", "memchr/std", "random", "big_number/std"]
zeroize = ["dep:zeroize", "big_number/zeroize"]

[dependencies]
base64 = { path = "../base64", default-features = false }
big_number = { path = "../big_number", default-features = false }
blake3 = { workspace = true, features = ["neon", "wasm32_simd"] }
constant_time_eq = { path = "../constant_time_eq" }
getrandom = { workspace = true, optional = true }
memchr = { workspace = true }
small_collections = { path = "../small_collections", optional = true, default-features = false }
zeroize = { workspace = true, optional = true }


[dev-dependencies]
hex = { path = "../hex" }
rand = { workspace = true }
serde_json = { workspace = true }
serde = { workspace = true, features = ["derive"] }

[target.'cfg(not(target_arch = "wasm32"))'.dev-dependencies]
criterion = { workspace = true }

[[bench]]
name = "aead"
harness = false

[[bench]]
name = "hash"
harness = false

[[bench]]
name = "kdf"
harness = false

[[bench]]
name = "mac"
harness = false

[[bench]]
name = "pbkdf"
harness = false

[[bench]]
name = "signatures"
harness = false

[[bench]]
name = "stream_ciphers"
harness = false
