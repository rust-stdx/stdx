[package]
name = "crypto"
version = "0.1.0"
description = "Pure Rust cryptography with no_std support and hardware/SIMD acceleration."
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[lints]
workspace = true


[lib]
path = "./src/crypto.rs"

[features]
default = ["std", "zeroize"]

alloc = ["dep:small_collections", "memchr/alloc", "base64/alloc", "big_number/alloc", "zeroize?/alloc"]
random = ["dep:getrandom"]
random_wasm = ["random", "getrandom/wasm_js"]
std = ["alloc", "small_collections?/std", "memchr/std", "random", "big_number/std", "constant_time_eq/std"]
zeroize = ["dep:zeroize", "big_number/zeroize"]

[dependencies]
base64 = { path = "../base64", default-features = false }
big_number = { path = "../big_number", default-features = false }
constant_time_eq = { path = "../constant_time_eq", default-features = false }
small_collections = { path = "../small_collections", optional = true, default-features = false }
zeroize = { path = "../zeroize", optional = true, default-features = false, features = ["derive"] }

getrandom = { workspace = true, optional = true }
memchr = { workspace = true }

[dev-dependencies]
alloc_counter = { path = "../alloc_counter" }
hex = { path = "../hex" }

rand = { workspace = true }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }

[target.'cfg(not(target_arch = "wasm32"))'.dev-dependencies]
criterion = { workspace = true }

[[bench]]
name = "aead"
harness = false

[[bench]]
name = "aegis"
harness = false

[[bench]]
name = "kem"
harness = false

[[bench]]
name = "hash"
harness = false

[[bench]]
name = "kdf"
harness = false

[[bench]]
name = "mac"
harness = false

[[bench]]
name = "pbkdf"
harness = false

[[bench]]
name = "signatures"
harness = false

[[bench]]
name = "stream_ciphers"
harness = false
