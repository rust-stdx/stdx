[package]
name = "constant_time_eq"
version = "0.6.1"
edition.workspace = true
rust-version.workspace = true
authors = ["Cesar Eduardo Barros <cesarb@cesarb.eti.br>"]
description = "Compares two equal-sized byte strings in constant time."
keywords = ["constant_time"]
categories = ["cryptography", "no-std"]

[lints]
workspace = true

[features]
default = ["std"]
# Necessary to detect at runtime whether DIT is available on aarch64.
std = []
# Enables tests which depend on the count_instructions crate (Linux-only).
count_instructions_test = []

[dev-dependencies]
count_instructions = { path = "../count_instructions" }

[target.'cfg(not(target_arch = "wasm32"))'.dev-dependencies]
criterion = { workspace = true }

[[bench]]
name = "bench"
harness = false

[[bench]]
name = "bench_generic"
harness = false
