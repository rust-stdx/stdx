[package]
name = "indexmap"
version = "2.14.2"
description = "A hash table with consistent order and fast iteration."
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[lints]
workspace = true

[lib]
path = "src/indexmap.rs"
bench = false

[dependencies]
hashbrown = { workspace = true }

cbor = { path = "../cbor", optional = true, default-features = false, features = ["alloc"] }
json = { path = "../json", optional = true, default-features = false, features = ["alloc"] }

[dev-dependencies]
random = { path = "../random", default-features = false }

[features]
default = ["std"]
std = []
cbor = ["dep:cbor"]
json = ["dep:json"]

# for testing only, of course
test_debug = []
