[package]
name = "zeroize"
version = "1.9.1"
description = "Securely clear secrets from memory with a simple trait built on stable Rust primitives which guarantee memory is zeroed using an operation that will not be 'optimized away' by the compiler."
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[lints]
workspace = true

[lib]
path = "./zeroize.rs"

[features]
default = ["alloc"]
alloc = []
std = ["alloc"]
derive = ["dep:zeroize_derive"]
serde = ["dep:serde"]

[dependencies]
zeroize_derive = { path = "zeroize_derive", optional = true }

serde = { workspace = true, optional = true }

[target.'cfg(not(target_arch = "wasm32"))'.dev-dependencies]
criterion = { workspace = true }

[[bench]]
name = "bench"
harness = false

[package.metadata.docs.rs]
all-features = true
