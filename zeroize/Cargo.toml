[package]
name = "zeroize"
version = "1.9.1"
description = "Securely clear secrets from memory with a simple trait built on stable Rust primitives which guarantee memory is zeroed using an operation that will not be 'optimized away' by the compiler."
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[lints]
workspace = true

[lib]
path = "./zeroize.rs"

[features]
default = ["alloc"]
alloc = []
std = ["alloc"]
derive = ["dep:zeroize_derive"]
cbor = ["dep:cbor"]
json = ["dep:json"]

[dependencies]
zeroize_derive = { path = "zeroize_derive", optional = true }

cbor = { path = "../cbor", optional = true, default-features = false, features = ["alloc"] }
json = { path = "../json", optional = true, default-features = false, features = ["alloc"] }

[package.metadata.docs.rs]
all-features = true
