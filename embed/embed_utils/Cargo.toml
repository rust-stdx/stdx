[package]
name = "embed_utils"
version = "8.4.0"
description = "Utilities for rust-embed"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[lib]
path = "./embed_utils.rs"

[dependencies]
crypto = { path = "../../crypto" }
media_type = { path = "../../media_type", optional = true }

walkdir = { workspace = true }

[dev-dependencies]
uuid = { path = "../../uuid" }
# [dependencies.globset]
# version = "0.4.8"
# optional = true

[features]
debug-embed = []
guess-media-type = ["dep:media_type"]
# include-exclude = ["globset"]

# TODO: `include-exclude` is disabled because the upstream `globset` crate is an external
# dependency (see the commented-out entry in `[dependencies]`). The `#[cfg(feature =
# "include-exclude")]` guards are kept so it can be restored later. The value is declared here
# via `check-cfg` (rather than as a real feature) so that `--all-features` does not try to
# compile code whose dependency is missing. Declaration-only: nothing is enabled.
[lints.rust.unexpected_cfgs]
level = "warn"
check-cfg = ['cfg(feature, values("include-exclude"))']
