[package]
name = "embed"
version = "8.4.0"
description = "Rust Custom Derive Macro which loads files into the rust binary at compile time during release and loads the file from the fs during dev"
edition.workspace = true
rust-version.workspace = true

[lib]
path = "./embed.rs"

[dependencies]
embed_impl = { path = "./embed_impl"}
embed_utils = { path = "./embed_utils"}

[dev-dependencies]
alloc_counter = { path = "../alloc_counter" }
crypto = { path = "../crypto" }


[features]
debug-embed = ["embed_impl/debug-embed", "embed_utils/debug-embed"]
guess-media-type = ["embed_impl/guess-media-type", "embed_utils/guess-media-type"]
# Features that need external dependencies and are therefore disabled:
# interpolate-folder-path = ["embed_impl/interpolate-folder-path"]              # needs `shellexpand`
# compression             = ["embed_impl/compression"]                          # needs `include-flate`
# include-exclude         = ["embed_impl/include-exclude", "embed_utils/include-exclude"]  # needs `globset`

# TODO: `compression` (needs `include-flate`), `include-exclude` (needs `globset`) and
# `interpolate-folder-path` (needs `shellexpand`) are disabled because they require external
# dependencies (see the commented-out entries above). The `#[cfg(feature = ...)]` guards are
# kept so they can be restored later. The values are declared here via `check-cfg` (rather than
# as real features) so that `--all-features` does not try to compile code whose dependencies
# are missing. Declaration-only: nothing is enabled.
[lints.rust.unexpected_cfgs]
level = "warn"
check-cfg = ['cfg(feature, values("compression", "include-exclude", "interpolate-folder-path"))']

