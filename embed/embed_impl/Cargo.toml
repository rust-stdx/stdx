[package]
name = "embed_impl"
version = "8.4.0"
description = "Rust Custom Derive Macro which loads files into the rust binary at compile time during release and loads the file from the fs during dev"
documentation = "https://rust-stdx.github.io/stdx/embed_impl/"
keywords = ["http", "rocket", "static", "web", "server"]
categories = ["web-programming::http-server"]
authors = ["pyros2097 <pyros2097@gmail.com>"]
edition.workspace = true
rust-version.workspace = true

[lib]
path = "./embed_impl.rs"
proc-macro = true

[dependencies]
syn = { workspace = true }
quote = { workspace = true }
proc-macro2 = { workspace = true }

embed_utils = { path = "../embed_utils"}

# [dependencies.shellexpand]
# version = "3"
# optional = true
#
[features]
debug-embed = []
# interpolate-folder-path = ["shellexpand"]
# compression = []
guess-media-type = ["embed_utils/guess-media-type"]
# include-exclude = ["rust-embed-utils/include-exclude"]

# TODO: `compression` (needs `include-flate`), `include-exclude` (needs `globset`) and
# `interpolate-folder-path` (needs `shellexpand`) are disabled because they require external
# dependencies (see the commented-out entries in `[dependencies]`). The `#[cfg(feature = ...)]`
# guards are kept so they can be restored later. The values are declared here via `check-cfg`
# (rather than as real features) so that `--all-features` does not try to compile code whose
# dependencies are missing. Declaration-only: nothing is enabled.
[lints.rust.unexpected_cfgs]
level = "warn"
check-cfg = ['cfg(feature, values("compression", "include-exclude", "interpolate-folder-path"))']
