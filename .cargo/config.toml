[target.wasm32-wasip1]
runner = ".cargo/cargo_wasm_runner.sh"
rustflags = ["-Clink-arg=-zstack-size=8388608"]
rustdocflags = ["-Clink-arg=-zstack-size=8388608"]

# Using lld as the linker greatly improve compilation times
[target.x86_64-unknown-linux-gnu]
rustflags = ["-Clink-args=-fuse-ld=lld"]

[target.aarch64-unknown-linux-gnu]
rustflags = ["-Clink-args=-fuse-ld=lld"]
