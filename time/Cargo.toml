[package]
name = "time"
version = "0.1.0"
description = "Date and time handling with an embedded IANA time zone database."
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[lints]
workspace = true

[lib]
path = "./time.rs"

[features]
default = ["std", "timezone-db"]
# Enables reading the clock and the system time zone. It uses `alloc`
# internally, but no public API requires a dynamic allocator.
std = []
# Embeds a copy of the IANA Time Zone Database into the binary. Works without
# `std`, and is enabled by default.
timezone-db = []
# Reads time zone rules from the system copy of the IANA database (for example
# `/usr/share/zoneinfo`). Implies `std`.
timezone-system = ["std", "dep:small_collections"]
# Reads the browser wall clock with `Date.now()` on `wasm32-unknown-unknown`.
# The JavaScript glue generated by `wasm-bindgen` must be present. Combined
# with `timezone-system`, it also detects the browser's local time zone.
wasm = ["std", "dep:js-sys"]
# Serde support using the RFC 3339 / RFC 9557 representation.
serde = ["dep:serde"]
# CBOR support: encodes IANA tag 1 (epoch-based date/time, whole seconds) and
# decodes tags 0 (RFC 3339 string) and 1.
cbor = ["dep:cbor"]

[dependencies]
cbor = { path = "../cbor", optional = true, default-features = false }
small_collections = { path = "../small_collections", optional = true }

serde = { workspace = true, optional = true, default-features = false, features = ["derive"] }

[target.'cfg(all(target_arch = "wasm32", target_os = "unknown"))'.dependencies]
js-sys = { workspace = true, optional = true }

[dev-dependencies]
# Tests use `cbor::to_vec`, which requires alloc. Keep this out of the
# `cbor` feature so the library itself remains alloc-free.
cbor = { path = "../cbor", default-features = false, features = ["alloc"] }

serde_json = { workspace = true }

[package.metadata.docs.rs]
all-features = true
