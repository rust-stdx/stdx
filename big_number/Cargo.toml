[package]
name = "big_number"
version = "0.1.0"
description = "Fixed-size unsigned and signed big integers with u64 limbs."
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[lints]
workspace = true

[lib]
path = "./big_number.rs"

[features]
default = ["std"]
alloc = ["zeroize?/alloc"]
std = ["alloc"]
zeroize = ["dep:zeroize", "zeroize/derive"]

[dependencies]
zeroize = { path = "../zeroize", optional = true, default-features = false, features = ["derive"] }

[dev-dependencies]
alloc_counter = { path = "../alloc_counter" }
crypto = { path = "../crypto" }
