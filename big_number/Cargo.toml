[package]
name = "big_number"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true

[lints]
workspace = true

[lib]
path = "./big_number.rs"

[features]
default = ["std"]
alloc = ["zeroize?/alloc"]
std = ["alloc"]
zeroize = ["dep:zeroize", "zeroize/derive"]

[dependencies]
zeroize = { workspace = true, optional = true }

[dev-dependencies]
alloc_counter = { path = "../alloc_counter" }
crypto = { path = "../crypto" }
