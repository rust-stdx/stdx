name: Docs

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-${{ github.ref }}
  # Never cancel a deployment on `main`; superseded builds elsewhere are cheap
  # to drop.
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

env:
  # Pinned nightly for rustdoc (see the Test workflow). Bump deliberately.
  NIGHTLY: nightly-2026-11-22

jobs:
  # Build the documentation on every branch. `make docs` builds rustdoc with
  # `-D warnings`, so this also serves as the documentation lint. Only `main`
  # is packaged as a Pages artifact.
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: recursive
      # Fail fast when a committed lockfile no longer matches its manifest.
      - run: cargo metadata --locked --format-version 1 > /dev/null && cargo metadata --locked --manifest-path benchmarks/Cargo.toml --format-version 1 > /dev/null
      - run: rustup update stable && rustup toolchain install "$NIGHTLY" --profile minimal
      - run: make docs
      - if: github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: target/doc

  # Deploy from a separate job: uploading and deploying in the same job races
  # the artifact service (actions/deploy-pages#451), and this way a failed
  # deployment can be retried without rebuilding or re-uploading.
  publish:
    needs: build
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
