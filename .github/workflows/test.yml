name: Test

on:
  push:
  pull_request:

jobs:
  test_native:
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-24.04-arm
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: recursive
      # .gitmodules sets `update = none` so Cargo doesn't fetch the submodules
      # when stdx is used as a git dependency. Force-fetch the test data needed
      # to compile and run `cargo test --workspace`.
      - run: git submodule update --init --force --depth=1 --checkout -- crypto/testdata/wycheproof maxminddb/test-data
      - run: sudo apt-get update && sudo apt upgrade && sudo apt-get install -y clang lld gcc-x86-64-linux-gnu gcc-aarch64-linux-gnu
      - run: rustup update stable
      - run: rustup target add x86_64-unknown-linux-gnu aarch64-unknown-linux-gnu wasm32-wasip1 riscv32imac-unknown-none-elf thumbv7em-none-eabi aarch64-linux-android aarch64-apple-ios aarch64-apple-darwin
      - run: make check
      - run: make check_tier1
      - run: make check_tier2
      # Check that some packages compile for no_std targets.
      - run: make check_no_std
      - run: make lint
      - run: cargo test --target ${{ matrix.target }} --workspace
      - run: cargo test --target ${{ matrix.target }} --workspace --no-default-features
      - run: cargo test --target ${{ matrix.target }} --workspace --all-features


  test_macos:
    # `macos-latest` is the Apple silicon (arm64) image. Only the host target is
    # built: the Linux cross-target checks in `make check` don't apply here.
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: recursive
      # .gitmodules sets `update = none` so Cargo doesn't fetch the submodules
      # when stdx is used as a git dependency. Force-fetch the test data needed
      # to compile and run `cargo test --workspace`.
      - run: git submodule update --init --force --depth=1 --checkout -- crypto/testdata/wycheproof maxminddb/test-data
      - run: rustup update stable
      - run: make check
      - run: make lint
      - run: cargo test --workspace
      - run: cargo test --workspace --no-default-features
      - run: cargo test --workspace --all-features


  test_wasm:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: recursive
      # .gitmodules sets `update = none` so Cargo doesn't fetch the submodules
      # when stdx is used as a git dependency. Force-fetch the Wycheproof test
      # vectors so the crypto tests can compile.
      - run: git submodule update --init --force --depth=1 --checkout -- crypto/testdata/wycheproof maxminddb/test-data
      - run: sudo apt-get update && sudo apt upgrade && sudo apt-get install -y clang lld
      - run: rustup update stable
      - run: rustup target add wasm32-wasip1
      - run: node tools/wasm_test/wasm_test.js
