[package]
name = "ipnetwork"
version = "0.21.1"
authors = ["Abhishek Chanda <abhishek.becs@gmail.com>", "Linus Färnstrand <faern@faern.net>"]
description = "A library to work with IP CIDRs in Rust"
keywords = ["network", "ip", "address", "cidr"]
categories = ["network-programming", "parser-implementations"]
edition.workspace = true
rust-version.workspace = true

[dependencies]
serde = { workspace = true, optional = true, features = ["std", "derive"] }
# schemars = { version = "1.0.4", optional = true }

[dev-dependencies]
serde_json = { workspace = true }
# criterion = {version = "0.5.1", features= ["html_reports"]}

[features]
# Keep optional dependencies out of the default features.
# Since most people add a dependency without `default-features = false` they involuntarily
# pull in unused dependencies.
default = []
serde = ["dep:serde"]

# TODO: `schemars` support is disabled because the upstream `schemars` crate is an external
# dependency (see the commented-out entry in `[dependencies]`). The `#[cfg(feature =
# "schemars")]` guards are kept so it can be restored later. The value is declared here via
# `check-cfg` (rather than as a real feature) so that `--all-features` does not try to
# compile code whose dependency is missing. This is declaration-only: nothing is enabled.
[lints.rust.unexpected_cfgs]
level = "warn"
check-cfg = ['cfg(feature, values("schemars"))']

# [[bench]]
# name = "parse_bench"
# harness = false
