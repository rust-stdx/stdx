[package]
name = "utf8-fuzz"
version = "0.0.0"
publish = false
edition = "2024"

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4"
utf8 = { path = "..", features = ["std"] }

[workspace]

[[bin]]
name = "validate"
path = "fuzz_targets/validate.rs"
test = false
doc = false

[profile.release]
debug = 1
