[package]
name = "json_derive"
version = "0.1.0"
description = "Derive macros for the stdx json crate"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[lints]
workspace = true

[lib]
path = "./json_derive.rs"
proc-macro = true

[features]
default = []

[dependencies]
proc-macro2 = { workspace = true }
quote = { workspace = true }
syn = { workspace = true, features = ["visit", "clone-impls"] }
