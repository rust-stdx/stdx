[package]
name = "json_derive"
version = "0.1.0"
description = "Derive macros for the stdx json crate"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[lints]
workspace = true

[lib]
path = "./json_derive.rs"
proc-macro = true

[features]
default = []

[dependencies]
proc-macro2 = { workspace = true, features = ["proc-macro"] }
quote = { workspace = true, features = ["proc-macro"] }
syn = { workspace = true, features = ["derive", "parsing", "printing", "proc-macro", "visit", "clone-impls"] }
