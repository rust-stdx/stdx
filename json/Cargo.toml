[package]
name = "json"
version = "0.1.0"
description = "A fast, strict JSON parser and generator with native derive macros, no_std support and SIMD acceleration"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[lints]
workspace = true

[lib]
path = "./json.rs"

[features]
default = ["std"]
std = ["alloc", "utf8/std"]
alloc = ["dep:small_collections"]
derive = ["dep:json_derive"]
heapless = ["dep:heapless"]
small_collections = ["alloc"]
bytes = ["dep:bytes", "alloc"]

[dependencies]
json_derive = { path = "./json_derive", optional = true }
small_collections = { path = "../small_collections", optional = true, default-features = false }
utf8 = { path = "../utf8", default-features = false }
zmij = { path = "../zmij" }

bytes = { workspace = true, optional = true }
heapless = { workspace = true, optional = true }

[dev-dependencies]
alloc_counter = { path = "../alloc_counter" }

[package.metadata.docs.rs]
all-features = true
