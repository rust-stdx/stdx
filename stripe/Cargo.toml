[package]
name = "stripe"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
description = "Pure-Rust, dependency-light client for the Stripe API, generated from Stripe's official OpenAPI specification"

[lints]
workspace = true

[lib]
path = "stripe.rs"
# The library has no unit tests (they all live in tests/), so there is no reason
# for `cargo test` to build a second, test-harness copy of the whole crate.
test = false

[features]
default = []
# default = ["reqwest", "core"]
# The default HTTP transport, backed by reqwest + the stdx rustls provider.
reqwest = ["dep:reqwest", "dep:crypto_rustls", "dep:tokio"]
# Umbrella over the resources a SaaS or online store needs: selling (checkout,
# prices, products), subscriptions including metered usage (the
# Meters API in `billing`, the customer portal in `billing_portal`), billing and
# invoices, payments and refunds, discounts, tax, and webhooks.
#
# Everything else is available as its own feature: Connect and money movement
# (`account`, `account_links`, `account_sessions`, `accounts`, `application_fees`,
# `payouts`, `topups`, `transfers`), in-person and mobile (`apple_pay`,
# `customer_sessions`, `ephemeral_keys`, `terminal`), the legacy payments
# plumbing (`sources`, `tokens`, `three_d_secure`), reconciliation and reporting
# (`balance`, `balance_settings`, `balance_transactions`, `reporting`, `sigma`),
# reference and file data (`country_specs`, `exchange_rates`, `file_links`,
# `files`), sales tooling (`plans`, `quotes`, `reviews`, `shipping_rates`,
# `payment_links`), and
# the newer payment record APIs (`payment_attempt_records`, `payment_records`,
# `payment_method_configurations`, `payment_method_domains`). See the crate
# documentation for what to add for a given product.
core = [
    # selling, and the customer portal
    "billing",
    "billing_portal",
    "checkout",
    "prices",
    "products",
    # subscriptions, including metered usage
    "coupons",
    "promotion_codes",
    "subscription_items",
    "subscription_schedules",
    "subscriptions",
    # invoices and tax
    "credit_notes",
    "invoiceitems",
    "invoices",
    "tax_codes",
    "tax_ids",
    "tax_rates",
    # payments
    "charges",
    "confirmation_tokens",
    "customers",
    "disputes",
    "mandates",
    "payment_intents",
    "payment_methods",
    "refunds",
    "setup_intents",
    # shared plumbing and webhooks
    "common",
    "webhook_endpoints",
]
# One feature per generated module (see `api/`), gating its request builders
# and methods. Response types are gated by reachability instead: a type is
# compiled when a module that can return it is enabled (see `stripe_codegen`),
# except for a small set of shared types, which are always compiled.
account = []
account_links = []
account_sessions = []
accounts = []
apple_pay = []
application_fees = []
apps = []
balance = []
balance_settings = []
balance_transactions = []
billing = []
billing_portal = []
charges = []
checkout = []
climate = []
common = []
confirmation_tokens = []
country_specs = []
coupons = []
credit_notes = []
customer_sessions = []
customers = []
disputes = []
entitlements = []
ephemeral_keys = []
events = []
exchange_rates = []
file_links = []
files = []
financial_connections = []
forwarding = []
identity = []
invoice_payments = []
invoice_rendering_templates = []
invoiceitems = []
invoices = []
issuing = []
mandates = []
payment_attempt_records = []
payment_intents = []
payment_links = []
payment_method_configurations = []
payment_method_domains = []
payment_methods = []
payment_records = []
payouts = []
plans = []
prices = []
product_catalog = []
products = []
promotion_codes = []
quotes = []
radar = []
refunds = []
reporting = []
reviews = []
setup_attempts = []
setup_intents = []
shipping_rates = []
sigma = []
sources = []
subscription_items = []
subscription_schedules = []
subscriptions = []
tax = []
tax_codes = []
tax_ids = []
tax_rates = []
terminal = []
test_helpers = []
three_d_secure = []
tokens = []
topups = []
transfers = []
treasury = []
v2_billing = []
v2_commerce = []
v2_core = []
webhook_endpoints = []

[dependencies]
bytes = { workspace = true }
constant_time_eq = { path = "../constant_time_eq" }
crypto = { path = "../crypto" }
crypto_rustls = { path = "../crypto_rustls", optional = true }
futures-util = { workspace = true, default-features = false, features = ["std"] }
reqwest = { workspace = true, optional = true, features = ["stream"] }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
tokio = { version = "1", optional = true, features = ["time"] }
uuid = { path = "../uuid" }
zeroize = { path = "../zeroize" }

[dev-dependencies]
alloc_counter = { path = "../alloc_counter" }
crypto = { path = "../crypto" }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
stripe_codegen = { path = "codegen" }
# Only the runtime pieces the tests need: a current-thread runtime and the
# `#[tokio::test]` attribute.
tokio = { version = "1", features = ["macros", "rt", "time"] }

# The integration tests double-check the account mode with `GET /v1/balance`
# before touching anything, so they are only built when `balance` is enabled.
# They are also opt-in at runtime (`STRIPE_INTEGRATION_TESTS=1`).
[[test]]
name = "integration"
required-features = ["reqwest", "core", "balance"]
