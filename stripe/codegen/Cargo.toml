[package]
name = "stripe_codegen"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
description = "Generates the stripe crate's types, parameters and methods from Stripe's official OpenAPI specification"

[lints]
workspace = true

[lib]
name = "stripe_codegen"
path = "codegen.rs"

[[bin]]
name = "stripe_codegen"
path = "main.rs"

[dependencies]
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
