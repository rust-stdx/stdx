[package]
name = "stripe_codegen"
version = "0.1.0"
description = "Generates the stripe crate's types, parameters and methods from Stripe's official OpenAPI specification"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[lints]
workspace = true

[lib]
name = "stripe_codegen"
path = "codegen.rs"

[[bin]]
name = "stripe_codegen"
path = "main.rs"

[dependencies]
json = { path = "../../json" }
