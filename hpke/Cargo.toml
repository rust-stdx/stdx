[package]
name = "hpke"
version = "0.1.0"
description = "Hybrid Public Key Encryption (draft-ietf-hpke-hpke-05, which obsoletes RFC 9180) built on the stdx `crypto` crate"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[lints]
workspace = true

[lib]
path = "./hpke.rs"

[features]
default = ["alloc", "random", "zeroize"]
alloc = ["crypto/alloc"]
random = ["crypto/random", "dep:random"]
zeroize = ["dep:zeroize", "crypto/zeroize"]

[dependencies]
crypto = { path = "../crypto", default-features = false }
random = { path = "../random", optional = true, default-features = false, features = ["system"] }
zeroize = { path = "../zeroize", optional = true, default-features = false, features = ["derive"] }

[dev-dependencies]
hex = { path = "../hex" }

json = { path = "../json" }
