[package]
name = "csv_derive"
version = "0.1.0"
description = "Derive macros for the csv crate"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[lints]
workspace = true

[lib]
path = "./csv_derive.rs"
proc-macro = true

[dependencies]
proc-macro2 = { workspace = true, features = ["proc-macro"] }
quote = { workspace = true, features = ["proc-macro"] }
syn = { workspace = true, features = ["derive", "parsing", "printing", "proc-macro", "visit", "clone-impls"] }
