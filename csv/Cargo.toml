[package]
name = "csv"
version = "0.1.0"
description = "A fast, low-allocation CSV parser with no_std and serde support."
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[lints]
workspace = true

[lib]
path = "./csv.rs"

[features]
default = ["std"]
std = ["serde?/std"]
serde = ["dep:ryu", "dep:serde"]

[dependencies]
ryu = { path = "../ryu", optional = true }

memchr = { workspace = true }
serde = { workspace = true, default-features = false, features = ["derive", "alloc"], optional = true }

[dev-dependencies]
alloc_counter = { path = "../alloc_counter" }
