[package]
name = "csv"
version = "0.1.0"
description = "A fast, low-allocation CSV parser with no_std and native derive support."
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[lints]
workspace = true

[lib]
path = "./csv.rs"

[features]
default = ["std"]
std = []
derive = ["dep:csv_derive", "dep:zmij"]

[dependencies]
csv_derive = { path = "./csv_derive", optional = true }
zmij = { path = "../zmij", optional = true }

memchr = { workspace = true }

[dev-dependencies]
alloc_counter = { path = "../alloc_counter" }
