[package]
name = "csv"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license = "MIT"

[lints]
workspace = true

[lib]
path = "./csv.rs"

[features]
default = ["std"]
std = ["serde?/std"]
serde = ["dep:ryu", "dep:serde"]

[dependencies]
memchr = { workspace = true }
ryu = { path = "../ryu", optional = true }
serde = { workspace = true, default-features = false, features = ["derive", "alloc"], optional = true }

[dev-dependencies]
alloc_counter = { path = "../alloc_counter" }
