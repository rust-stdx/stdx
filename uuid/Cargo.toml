[package]
name = "uuid"
version = "0.1.0"
description = "Generate, encode and decode UUIDs (RFC 9562) — supports v4 and v7"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[lints]
workspace = true

[lib]
path = "./uuid.rs"

[features]
default = ["std"]
std = ["dep:rand"]
serde = ["dep:serde"]
cbor = ["dep:cbor"]

[dependencies]
cbor = { path = "../cbor", optional = true, default-features = false }

heapless = { workspace = true }
rand = { workspace = true, optional = true }
serde = { workspace = true, optional = true }

[dev-dependencies]
alloc_counter = { path = "../alloc_counter" }
# Tests use `cbor::to_vec`, which requires alloc. Keep this out of the
# `cbor` feature so the library itself remains alloc-free.
cbor = { path = "../cbor", default-features = false, features = ["alloc"] }

serde_json = { workspace = true }

[target.'cfg(not(target_arch = "wasm32"))'.dev-dependencies]
criterion = { workspace = true }

[[bench]]
name = "bench"
harness = false
