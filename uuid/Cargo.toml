[package]
name = "uuid"
version = "0.1.0"
description = "Generate, encode and decode UUIDs (RFC 9562) — supports v4 and v7"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[lints]
workspace = true

[lib]
path = "./uuid.rs"

[features]
default = ["std"]
std = ["dep:random"]
cbor = ["dep:cbor"]
json = ["dep:json"]

[dependencies]
cbor = { path = "../cbor", optional = true, default-features = false }
json = { path = "../json", optional = true, default-features = false, features = ["alloc"] }
random = { path = "../random", optional = true, features = ["std"] }

heapless = { workspace = true }

[dev-dependencies]
alloc_counter = { path = "../alloc_counter" }
# Tests use `cbor::to_vec`, which requires alloc. Keep this out of the
# `cbor` feature so the library itself remains alloc-free.
cbor = { path = "../cbor", default-features = false, features = ["alloc"] }
random = { path = "../random", default-features = false }
