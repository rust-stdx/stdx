[package]
name = "xxhash"
version = "0.1.0"
description = "xxHash — extremely fast non-cryptographic hash algorithm."
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[lints]
workspace = true

[lib]
path = "./xxhash.rs"

[features]
default = ["std"]
# Enables runtime CPU feature detection (AVX2 / AVX-512) in addition to the
# compile-time dispatch. Requires the standard library.
std = []

[target.'cfg(not(target_arch = "wasm32"))'.dev-dependencies]
alloc_counter = { path = "../alloc_counter" }

criterion = { workspace = true }

[[bench]]
name = "hash"
harness = false
