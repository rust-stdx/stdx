[package]
name = "base64"
version = "0.1.0"
description = "Fast base64 encoding and decoding with SIMD acceleration when available"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[lints]
workspace = true

[lib]
path = "./base64.rs"

[features]
default = ["alloc"]
alloc = []
serde = ["dep:serde"]
small_collections = ["dep:small_collections", "serde", "alloc"]

[dependencies]
small_collections = { path = "../small_collections", optional = true, default-features = false }

serde = { workspace = true, optional = true }

[dev-dependencies]
alloc_counter = { path = "../alloc_counter" }

serde_json = { workspace = true }
serde_test = { workspace = true }

[target.'cfg(not(target_arch = "wasm32"))'.dev-dependencies]
criterion = { workspace = true }

[[bench]]
name = "bench"
harness = false
