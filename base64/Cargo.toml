[package]
name = "base64"
version = "0.1.0"
description = "Fast base64 encoding and decoding with SIMD acceleration when available"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[lints]
workspace = true

[lib]
path = "./base64.rs"

[features]
default = ["alloc"]
alloc = []
json = ["dep:json", "alloc"]
small_collections = ["dep:small_collections", "json", "alloc"]

[dependencies]
json = { path = "../json", optional = true, default-features = false, features = ["alloc"] }
small_collections = { path = "../small_collections", optional = true, default-features = false }

[dev-dependencies]
alloc_counter = { path = "../alloc_counter" }
json = { path = "../json", features = ["derive"] }
random = { path = "../random", default-features = false }

[[test]]
name = "json"
path = "tests/json.rs"
required-features = ["json"]
