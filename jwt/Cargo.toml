[package]
name = "jwt"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true

[lints]
workspace = true

[lib]
path = "jwt.rs"

[features]
default = ["std", "zeroize"]

# Enables the standard library: the `SystemClock` and the std-backed features of
# the dependencies. Implies `random`.
std = ["random", "crypto/std", "serde/std", "small_collections/std"]
# Enables ML-DSA signing, which requires a random number generator. On `no_std`
# targets this needs a `getrandom` backend (see the `getrandom` documentation).
random = ["crypto/random"]
zeroize = ["crypto/zeroize"]

[dependencies]
base64 = { path = "../base64" }
constant_time_eq = { path = "../constant_time_eq" }
# `jwt` always needs `alloc` (it builds `String`s and `Vec`s), and it uses
# `crypto`'s `alloc`-gated APIs (`rsa::PublicKey::n_bytes`/`e_bytes`).
crypto = { path = "../crypto", default-features = false, features = ["alloc"] }
serde = { workspace = true, default-features = false, features = ["alloc", "derive"] }
serde_json = { workspace = true, default-features = false, features = ["alloc"] }
small_collections = { path = "../small_collections", default-features = false, features = ["serde"] }
