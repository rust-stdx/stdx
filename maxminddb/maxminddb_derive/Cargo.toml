[package]
name = "maxminddb_derive"
version = "0.1.0"
description = "Derive macros for the maxminddb crate"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[lints]
workspace = true

[lib]
path = "./maxminddb_derive.rs"
proc-macro = true

[dependencies]
proc-macro2 = { workspace = true }
quote = { workspace = true }
syn = { workspace = true, features = ["visit", "clone-impls"] }
