[package]
name = "scheduler"
version = "0.1.0"
description = "Async job scheduler with cron and fixed-interval schedules."
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[lints]
workspace = true

[lib]
path = "./lib.rs"

[features]
default = ["tracing"]
tracing = ["dep:tracing"]

[dependencies]
cron = { path = "../cron" }
time = { path = "../time" }

tokio = { workspace = true }
tracing = { workspace = true, optional = true }
