[package]
name = "cbor_derive"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
description = "Derive macros for the cbor crate"

[lints]
workspace = true

[lib]
path = "./cbor_derive.rs"
proc-macro = true

[dependencies]
proc-macro2 = { workspace = true }
quote = { workspace = true }
syn = { workspace = true, features = ["visit", "clone-impls"] }
