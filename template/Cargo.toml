[package]
name = "template"
version = "0.1.0"
edition = "2024"
rust-version.workspace = true

[lib]
path = "./template.rs"

[features]
default = ["std"]
std = ["serde/std", "memchr/std"]

[dependencies]
memchr = { workspace = true }
serde = { workspace = true, default-features = false, features = ["derive", "alloc"] }
