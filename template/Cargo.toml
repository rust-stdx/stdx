[package]
name = "template"
version = "0.1.0"
description = "A fast, safe template engine for HTML and text rendering, inspired by Jinja2."
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[lints]
workspace = true

[lib]
path = "./template.rs"

[features]
default = ["std", "derive"]
std = ["memchr/std"]
derive = ["dep:template_derive"]

[dependencies]
template_derive = { path = "./template_derive", optional = true }

memchr = { workspace = true }

[dev-dependencies]
alloc_counter = { path = "../alloc_counter" }
random = { path = "../random", default-features = false }
