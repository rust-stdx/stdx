[package]
name = "template"
version = "0.1.0"
description = "A fast, safe template engine for HTML and text rendering, inspired by Jinja2."
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[lints]
workspace = true

[lib]
path = "./template.rs"

[features]
default = ["std"]
std = ["serde/std", "memchr/std"]

[dependencies]
memchr = { workspace = true }
serde = { workspace = true, default-features = false, features = ["derive", "alloc"] }

[dev-dependencies]
alloc_counter = { path = "../alloc_counter" }
